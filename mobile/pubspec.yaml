name: parking_mobile
description: Parking Mobile V1 — customer (5 tabs) + staff (4 tabs), offline-first local SQLite mirror.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5
  pocketbase: ^0.25.3
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
